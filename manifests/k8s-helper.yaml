# A read-only Kubernetes assistant that runs as an Agent Substrate actor.
# kagent 1.0: Agent = template (what it does, inline here) + harnessRef (how/where it runs).
# The go-adk-substrate Harness is in shared-harness.yaml.
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: k8s-helper
  namespace: kagent
spec:
  template:
    inline:
      description: Read-only Kubernetes assistant running inside a gVisor actor on Agent Substrate.
      modelConfig:
        name: default-model-config        # Ollama qwen3:4b-instruct, created by the Helm chart
      systemPrompt: |
        You are a concise Kubernetes assistant. You run inside a gVisor sandbox (an
        "actor") on Agent Substrate, orchestrated by kagent. Use your tools to look at
        the cluster before answering. You are read-only: never try to change anything.
      tools:
      - mcp:
          server:
            kind: RemoteMCPServer
            name: kagent-tool-server
          tools:
          - k8s_get_resources
          - k8s_describe_resource
          - k8s_get_pod_logs
          - k8s_get_events
          - datetime_get_current_time
  harnessRef:
    name: go-adk-substrate
