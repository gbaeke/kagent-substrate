# kagent 1.0 split form: one reusable Harness (how/where to run) + AgentTemplates
# (what to do), joined by lightweight Agents. Every Agent references a Harness.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: go-adk-substrate
  namespace: kagent
spec:
  kagent: {}                      # the kagent Go ADK runtime; image comes from the release catalog
  substrate:
    workerPoolRef:
      name: kagent-default        # created by the kagent chart (substrateWorkerPool)
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/   # RustFS bucket from the substrate chart (S3 backend uses gs:// URIs)
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: haiku-poet
  namespace: kagent
spec:
  description: Answers every question as a haiku. No tools, so its egress allowlist is just the model.
  modelConfig:
    name: default-model-config
  systemPrompt: |
    You answer every message with a single haiku (5-7-5 syllables). Nothing else.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: haiku-poet
  namespace: kagent
spec:
  template:
    ref:
      name: haiku-poet
  harnessRef:
    name: go-adk-substrate
