# kagent 1.0 split form: one reusable Harness (how/where to run) + AgentTemplates
# (what to do), joined by lightweight Agents. Many agents can share one Harness.
apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: go-adk-substrate
  namespace: kagent
spec:
  kagent: {}
  workload:
    image: ghcr.io/kagent-dev/kagent/golang-adk@sha256:ed668c38a5805723912497d4ea085e711cf585d440907abfff3dd27991d768cc
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: s3://ate-snapshots/kagent
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: haiku-poet
  namespace: kagent
spec:
  description: Answers every question as a haiku. No tools, so its egress allowlist is just the model.
  modelConfig:
    name: default-model-config
  systemPrompt: |
    You answer every message with a single haiku (5-7-5 syllables). Nothing else.
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: haiku-poet
  namespace: kagent
spec:
  templateRef:
    name: haiku-poet
  harnessRef:
    name: go-adk-substrate
