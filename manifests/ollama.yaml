# In-cluster Ollama (CPU) so the PoC needs no API key and exposes nothing on the host.
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ollama
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: ollama}
  template:
    metadata:
      labels: {app: ollama}
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
        - name: OLLAMA_KEEP_ALIVE
          value: "30m"
        - name: OLLAMA_CONTEXT_LENGTH
          value: "16384"
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {memory: 10Gi}
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        readinessProbe:
          httpGet: {path: /api/tags, port: 11434}
          periodSeconds: 5
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ollama
spec:
  selector: {app: ollama}
  ports:
  - port: 11434
    targetPort: 11434
